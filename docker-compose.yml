services:
  eon8-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eon8-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4173"
      TRUST_PROXY: "true"
    volumes:
      # Persistent CMS content, auth state, and leads inbox across redeploys
      - ./data:/app/data
      # Persistent user-uploaded blog media across redeploys
      - ./public/uploads:/app/public/uploads
