# Nginx site for stage.eon8.com (staging). Search engines are kept out with a
# noindex header. Get the certificate first, then enable this file:
#
#   sudo certbot certonly --standalone -d stage.eon8.com \
#        --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#   sudo cp deploy/nginx/eon8-proxy.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/eon8-staging.conf /etc/nginx/sites-available/eon8-staging.conf
#   sudo ln -s /etc/nginx/sites-available/eon8-staging.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Staging and production can share one VPS only if they use different app ports
# (two copies of the project); otherwise use one VPS per environment.

limit_req_zone $binary_remote_addr zone=eon8s_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eon8s_login:10m rate=10r/m;

upstream eon8_staging_app {
    server 127.0.0.1:4173;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.eon8.com;
    return 301 https://stage.eon8.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stage.eon8.com;
    ssl_certificate     /etc/letsencrypt/live/stage.eon8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.eon8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/cms/auth/login {
        limit_req zone=eon8s_login burst=5 nodelay;
        proxy_pass http://eon8_staging_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location /api/ {
        limit_req zone=eon8s_api burst=40 nodelay;
        proxy_pass http://eon8_staging_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location / {
        proxy_pass http://eon8_staging_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }
}
