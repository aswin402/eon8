# Nginx site for www.eon8.com (production). Staging uses eon8-staging.conf.
#
# Order matters: get the certificate FIRST, then enable this file (Nginx refuses
# to load "listen 443 ssl" blocks whose certificate files do not exist yet).
#
#   sudo certbot certonly --standalone -d www.eon8.com -d eon8.com \
#        --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#   sudo cp deploy/nginx/eon8-proxy.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/eon8.conf /etc/nginx/sites-available/eon8.conf
#   sudo ln -s /etc/nginx/sites-available/eon8.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certbot hooks are saved, so automatic renewals stop Nginx for a few seconds
# and start it again. Check with: sudo certbot renew --dry-run

limit_req_zone $binary_remote_addr zone=eon8_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eon8_login:10m rate=10r/m;

upstream eon8_app {
    server 127.0.0.1:4173;
    keepalive 32;
}

# http and the bare domain -> https://www.eon8.com
server {
    listen 80;
    listen [::]:80;
    server_name eon8.com www.eon8.com;
    return 301 https://www.eon8.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eon8.com;
    ssl_certificate     /etc/letsencrypt/live/www.eon8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.eon8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.eon8.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eon8.com;
    ssl_certificate     /etc/letsencrypt/live/www.eon8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.eon8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eon8_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 15m;   # admin image uploads (8 MB images as base64)
    server_tokens off;

    # Optional: allow the admin only from office IPs. Uncomment and list the IPs.
    # location ~ ^/(admin-dashboard|api/admin/|api/cms/admin/|api/cms/auth/) {
    #     allow 203.0.113.10;     # office
    #     deny all;
    #     proxy_pass http://eon8_app;
    #     include /etc/nginx/snippets/eon8-proxy.conf;
    # }

    location /api/cms/auth/login {
        limit_req zone=eon8_login burst=5 nodelay;
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location /api/ {
        limit_req zone=eon8_api burst=40 nodelay;
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location / {
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }
}
