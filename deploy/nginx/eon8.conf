# Nginx site for the EON8 website. Copy to /etc/nginx/sites-available/eon8.conf,
# replace the domain names, link into sites-enabled, then:
#   sudo certbot --nginx -d eon8.com -d www.eon8.com
# For staging use stage.eon8.com and keep the "noindex" header below enabled.

limit_req_zone $binary_remote_addr zone=eon8_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eon8_login:10m rate=10r/m;

upstream eon8_app {
    server 127.0.0.1:4173;
    keepalive 32;
}

# Redirect bare domain and http to https://www.eon8.com
server {
    listen 80;
    listen [::]:80;
    server_name eon8.com www.eon8.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.eon8.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eon8.com;
    # ssl_certificate lines are added by certbot
    return 301 https://www.eon8.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eon8.com;
    # ssl_certificate lines are added by certbot

    client_max_body_size 15m;   # admin image uploads (8 MB images as base64)
    server_tokens off;

    # Staging only: keep search engines out of stage.eon8.com
    # add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/cms/auth/login {
        limit_req zone=eon8_login burst=5 nodelay;
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location /api/ {
        limit_req zone=eon8_api burst=40 nodelay;
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }

    location / {
        proxy_pass http://eon8_app;
        include /etc/nginx/snippets/eon8-proxy.conf;
    }
}
