# Shared proxy settings. Copy to /etc/nginx/snippets/eon8-proxy.conf
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;   # the server uses this as the visitor IP (TRUST_PROXY=1)
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
# Behind Cloudflare, $remote_addr is a Cloudflare address. Restore the visitor IP
# in the http {} block: set_real_ip_from <each Cloudflare range>; real_ip_header CF-Connecting-IP;
