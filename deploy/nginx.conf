# Production Nginx reverse-proxy configuration for EON8 (www.eon8.com)
# Place in /etc/nginx/sites-available/eon8.conf and symlink into sites-enabled/
# Provision TLS certificates with Certbot (`certbot --nginx -d eon8.com -d www.eon8.com`).

limit_req_zone $binary_remote_addr zone=eon8_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=eon8_leads:10m rate=15r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eon8.com www.eon8.com;
    return 301 https://www.eon8.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eon8.com;

    # ssl_certificate /etc/letsencrypt/live/eon8.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eon8.com/privkey.pem;
    return 301 https://www.eon8.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eon8.com;

    # ssl_certificate /etc/letsencrypt/live/eon8.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eon8.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 14m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate-limit CMS login and public lead capture at the edge
    location = /api/cms/auth/login {
        limit_req zone=eon8_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/leads {
        limit_req zone=eon8_leads burst=5 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-term immutable cache for Vite fingerprinted assets
    location /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy all SPA routes, SSR SEO injection, dynamic /sitemap.xml, uploads & APIs
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
